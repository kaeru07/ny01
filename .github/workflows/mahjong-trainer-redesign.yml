name: Mahjong trainer redesign check

on:
  push:
    branches:
      - feature/mahjong-trainer-redesign-20261004
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mahjong-trainer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mahjong-trainer/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
