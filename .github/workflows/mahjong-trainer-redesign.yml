name: Mahjong trainer redesign check

on:
  push:
    branches:
      - feature/mahjong-trainer-redesign-20261004
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mahjong-trainer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mahjong-trainer/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Install visual check browser
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Capture iPhone layouts
        run: |
          mkdir -p visual-artifacts
          npm run start -- -p 3000 > /tmp/mahjong-next.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000 >/dev/null; then break; fi
            sleep 1
          done
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const cases = [
              { name: 'iphone-portrait-430x932', width: 430, height: 932 },
              { name: 'iphone-landscape-932x430', width: 932, height: 430 },
            ];
            for (const item of cases) {
              const page = await browser.newPage({ viewport: { width: item.width, height: item.height } });
              await page.goto('http://127.0.0.1:3000', { waitUntil: 'networkidle' });
              await page.getByRole('button', { name: '対局開始' }).click();
              await page.waitForTimeout(900);
              const layout = await page.evaluate(() => ({
                scrollWidth: document.documentElement.scrollWidth,
                clientWidth: document.documentElement.clientWidth,
                scrollHeight: document.documentElement.scrollHeight,
                clientHeight: document.documentElement.clientHeight,
                board: !!document.querySelector('.table-surface'),
                hand: !!document.querySelector('.self-hand-area'),
                center: !!document.querySelector('.table-center'),
              }));
              console.log(item.name, layout);
              if (!layout.board || !layout.hand || !layout.center) {
                throw new Error(item.name + ': required table elements are missing');
              }
              if (layout.scrollWidth > layout.clientWidth + 2) {
                throw new Error(item.name + ': horizontal overflow ' + layout.scrollWidth + ' > ' + layout.clientWidth);
              }
              await page.screenshot({
                path: 'visual-artifacts/' + item.name + '.png',
                fullPage: false,
              });
              await page.close();
            }
            await browser.close();
          })();
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: mahjong-trainer-iphone-layouts
          path: mahjong-trainer/visual-artifacts/*.png
          if-no-files-found: error
