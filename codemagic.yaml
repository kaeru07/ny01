# Codemagic CI/CD — mahjong-trainer (Next.js + Capacitor iOS) → TestFlight
#
# Repository: kaeru07/ny01
# App directory: mahjong-trainer
#
# Codemagic requires this file at the repository root. The workflow below uses
# `working_directory: mahjong-trainer` so it only builds the practical mahjong
# reading trainer sub-app.
#
# Secrets are not stored here. App Store Connect integration, distribution
# certificate, and provisioning profile references must exist in Codemagic UI.

workflows:
  # One-shot: register the Bundle ID on Apple Developer Portal via the ASC API
  # key integration. Needed once before automatic code signing can create
  # provisioning profiles for a new app.
  register-bundle-id:
    name: Register Bundle ID (mahjong-trainer)
    max_build_duration: 10
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: ASC_API_KEY
    environment:
      vars:
        BUNDLE_ID: "com.kaeru07.mahjongtrainer"
    scripts:
      - name: Ensure app store profile exists
        script: |
          set -e
          # cli-tools mixes ANSI-colored log lines into stdout; strip them and
          # locate the JSON payload at a line start before parsing.
          json_id() { python3 -c "
          import sys, json, re
          s = re.sub(r'\x1b\[[0-9;]*[A-Za-z]', '', sys.stdin.read())
          for i in [i for i in range(len(s)) if s[i] in '[{' and (i == 0 or s[i-1] == '\n')]:
              try:
                  d = json.loads(s[i:])
                  break
              except Exception:
                  continue
          else:
              sys.exit('no json in input')
          d = d if isinstance(d, list) else [d]
          print(' '.join(r['id'] for r in d))
          "; }
          echo "== bundle id =="
          BUNDLE_RES_ID=$(app-store-connect list-bundle-ids --bundle-id-identifier "$BUNDLE_ID" --platform IOS --json | json_id)
          echo "bundle id resource: $BUNDLE_RES_ID"
          echo "== distribution certificates =="
          CERT_IDS=$(app-store-connect list-certificates --type DISTRIBUTION --json | json_id || true)
          if [ -z "$CERT_IDS" ]; then
            CERT_IDS=$(app-store-connect list-certificates --type IOS_DISTRIBUTION --json | json_id || true)
          fi
          echo "cert ids: $CERT_IDS"
          if [ -z "$CERT_IDS" ]; then
            echo "ERROR: no distribution certificate found in the Apple Developer account"
            exit 1
          fi
          echo "== create app store profile =="
          app-store-connect create-profile "$BUNDLE_RES_ID" \
            --type IOS_APP_STORE \
            --name "mahjong-trainer app_store" \
            --certificate-ids $CERT_IDS

  mahjong-trainer-ios-testflight:
    name: Mahjong Trainer iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    working_directory: mahjong-trainer

    integrations:
      app_store_connect: ASC_API_KEY

    environment:
      node: 22.11.0
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.kaeru07.mahjongtrainer"
        APP_VERSION: "1.0"
        BUILD_NUMBER: "1"
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
      groups:
        - mahjong_signing # CERTIFICATE_PRIVATE_KEY (secure, registered via Codemagic API)

    scripts:
      - name: Install dependencies
        script: |
          npm ci || npm install

      - name: Build Next.js static app
        script: |
          npm run build

      - name: Sync Capacitor iOS
        script: |
          npx cap sync ios

      - name: Set iOS app version
        script: |
          set -e
          cd ios/App
          agvtool new-marketing-version "$APP_VERSION"
          agvtool new-version -all "$BUILD_NUMBER"

      - name: Set up code signing
        script: |
          set -e
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --platform IOS \
            --type IOS_APP_STORE \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY \
            --create
          keychain add-certificates
          xcode-project use-profiles
          echo "--- provisioning profiles in keychain dir ---"
          ls -1 "$HOME/Library/MobileDevice/Provisioning Profiles" 2>/dev/null || echo "(none)"

      - name: Build IPA
        script: |
          set -e
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - ios/App/build/outputs/**/*.ipa
      - mahjong-trainer/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - mahjong-trainer/ios/App/build/outputs/**/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
