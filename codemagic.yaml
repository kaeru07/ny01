# Codemagic CI/CD — mahjong-trainer (Next.js + Capacitor iOS) → TestFlight
#
# Repository: kaeru07/ny01
# App directory: mahjong-trainer
#
# Codemagic requires this file at the repository root. The workflow below uses
# `working_directory: mahjong-trainer` so it only builds the practical mahjong
# reading trainer sub-app.
#
# Secrets are not stored here. App Store Connect integration, distribution
# certificate, and provisioning profile references must exist in Codemagic UI.

workflows:
  mahjong-trainer-ios-testflight:
    name: Mahjong Trainer iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    working_directory: mahjong-trainer

    integrations:
      app_store_connect: ASC_API_KEY

    environment:
      node: 20.11.0
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.kaeru07.mahjongtrainer"
        APP_VERSION: "1.0"
        BUILD_NUMBER: "1"
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
      ios_signing:
        certificates:
          - IOS_DISTRIBUTION_CERTIFICATE
        provisioning_profiles:
          - MAHJONG_TRAINER_APP_STORE_PROFILE

    scripts:
      - name: Install dependencies
        script: |
          npm ci || npm install

      - name: Build Next.js static app
        script: |
          npm run build

      - name: Sync Capacitor iOS
        script: |
          npx cap sync ios

      - name: Set iOS app version
        script: |
          set -e
          cd ios/App
          agvtool new-marketing-version "$APP_VERSION"
          agvtool new-version -all "$BUILD_NUMBER"

      - name: Set up code signing
        script: |
          set -e
          xcode-project use-profiles
          echo "--- provisioning profiles in keychain dir ---"
          ls -1 "$HOME/Library/MobileDevice/Provisioning Profiles" 2>/dev/null || echo "(none)"

      - name: Build IPA
        script: |
          set -e
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - ios/App/build/outputs/**/*.ipa
      - mahjong-trainer/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - mahjong-trainer/ios/App/build/outputs/**/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
